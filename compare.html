<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renderer compare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=swap">
  <style>:root{--page:#272727;--fg:#fff;--muted:#ffffffb3;--line:#ffffff2e;--accent:#ffc700}html,body{background:var(--page);height:100%;color:var(--fg);margin:0;font-family:Figtree,system-ui,sans-serif}body{grid-template-rows:auto 1fr;display:grid}header{border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;display:flex}header .spacer{flex:1}button{all:unset;cursor:pointer;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 16px;font-size:14px}button:hover,button[aria-pressed=true]{color:var(--fg);border-color:#ffffff80}button.primary{color:var(--accent);border-color:color-mix(in srgb, var(--accent) 55%, transparent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}main{background:var(--line);grid-template-columns:1fr 1fr;gap:1px;min-height:0;display:grid}@media (width<=900px){main{grid-template-rows:1fr 1fr;grid-template-columns:1fr}}figure{background:var(--page);min-height:0;margin:0;position:relative}figcaption{z-index:1;letter-spacing:.06em;color:var(--muted);pointer-events:none;font-size:13px;position:absolute;top:12px;left:16px}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
  <header>
    <button class="primary" id="replay">Replay from flat</button>
    <span class="spacer"></span>
    <button id="tv-pins" data-tv="pins" aria-pressed="true">Tokens: pins</button>
    <button id="tv-dots" data-tv="dots" aria-pressed="false">Tokens: dots</button>
    <button id="tv-redline" data-tv="redline" aria-pressed="false">Tokens: redline</button>
    <span class="spacer"></span>
    <button id="model-c" aria-pressed="true">Option C</button>
    <button id="model-b" aria-pressed="false">Option B</button>
  </header>
  <main>
    <figure><figcaption>CSS 3D</figcaption><iframe id="css" title="Hero, CSS 3D renderer"></iframe></figure>
    <figure><figcaption>WebGL</figcaption><iframe id="gl" title="Hero, WebGL renderer"></iframe></figure>
  </main>
  <script>
    let model = new URLSearchParams(location.search).get('model') === 'b' ? 'b' : 'c'
    let tv = new URLSearchParams(location.search).get('tokens') || 'pins'
    const css = document.getElementById('css'), gl = document.getElementById('gl')
    // both reload together from the flat beat, so their 1.5s holds and lifts start at the same moment
    function load() {
      const q = (r) => `index.html?renderer=${r}${model === 'b' ? '&model=b' : ''}&tokens=${tv}&t=${Date.now()}`
      document.querySelectorAll('[data-tv]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tv === tv)))
      css.src = q('css3d'); gl.src = q('webgl')
      document.getElementById('model-c').setAttribute('aria-pressed', String(model === 'c'))
      document.getElementById('model-b').setAttribute('aria-pressed', String(model === 'b'))
    }
    document.getElementById('replay').onclick = load
    document.querySelectorAll('[data-tv]').forEach((b) => { b.onclick = () => { tv = b.dataset.tv; load() } })
    document.getElementById('model-c').onclick = () => { model = 'c'; load() }
    document.getElementById('model-b').onclick = () => { model = 'b'; load() }
    load()
  </script>
</body>
</html>
